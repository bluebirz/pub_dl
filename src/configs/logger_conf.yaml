version: 1
disable_existing_loggers: True

formatters:
  std:
    format: "%(asctime)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S %Z"
  dbg:
    format: "%(asctime)s [%(levelname)s] (%(name)s) %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S %Z"

handlers:
  console:
    class: logging.StreamHandler
    formatter: dbg
    level: INFO
    stream: ext://sys.stdout

loggers:
  default:
    handlers: [console]

root:
  level: DEBUG
  handlers: [console]
