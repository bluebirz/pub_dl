[project]
name = "pub-dl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bluebirz" }
]
requires-python = ">=3.12, <=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "img2pdf>=0.6.3",
    "patchright>=1.64.3",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true
module-root = "src"
